<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ग्राम पंचायत सांजू</title>
  <meta name="description" content="ग्राम पंचायत सांजू के विकास कार्य — पहले और बाद की तस्वीरें, लागत और प्रगति।">
  <meta name="theme-color" content="#0b5d3b">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="vikas">
  <div id="site-header"></div>
  <section class="page-hero" data-title="विकास कार्य" data-sub="हर काम का हिसाब — लागत, प्रगति और पहले-बाद की तस्वीरें"></section>

  <main id="main">
    <section class="section">
      <div class="container">
        <div class="stats stats-4" id="vikas-stats"></div>
      </div>
    </section>
    <section class="section section-sand">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">बदलाव की तस्वीर</span>
          <h2 class="section-title">पहले और बाद</h2>
          <p class="section-sub">बीच की पट्टी को दाएँ-बाएँ खिसकाएँ।</p>
        </div>
        <div class="ba-grid" id="ba-list"></div>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <h2 class="section-title">सभी विकास कार्य</h2>
        <div class="toolbar">
          <div class="filters" id="vikas-filters"></div>
          <select id="vikas-shreni" aria-label="श्रेणी चुनें"></select>
        </div>
        <div class="grid grid-3" id="vikas-list"></div>
        <p class="empty" id="vikas-empty"></p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
